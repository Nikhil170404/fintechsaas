<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – FinTech SaaS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #f0f4fa; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      margin: 0; padding: 1rem;
    }
    .login-wrapper { width: 100%; max-width: 420px; }
    .login-card {
      background: #fff; border-radius: 1.25rem;
      box-shadow: 0 12px 40px rgba(15,23,42,.12), 0 4px 12px rgba(15,23,42,.06);
      padding: 2.5rem 2.25rem 2rem;
    }
    .login-brand { text-align: center; margin-bottom: 1.75rem; }
    .brand-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #1e3a5f 0%, #2e6db4 100%);
      border-radius: 1rem; display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.75rem; color: #fff; margin-bottom: 1.125rem;
      box-shadow: 0 8px 20px rgba(30,58,95,.3);
    }
    .brand-title { font-size: 1.375rem; font-weight: 800; color: #0f172a; letter-spacing: -.03em; margin: 0; }
    .form-label { font-weight: 600; font-size: .875rem; color: #334155; margin-bottom: .375rem; }
    .form-control {
      border-color: #e2e8f0; border-radius: .625rem; font-size: .9375rem;
      padding: .6rem .875rem; color: #1e293b;
    }
    .form-control:focus { border-color: #2e6db4; box-shadow: 0 0 0 3px rgba(46,109,180,.15); }
    .btn-signin {
      background: linear-gradient(135deg, #1e3a5f 0%, #2e6db4 100%); color: #fff;
      font-weight: 700; font-size: 1rem; padding: .7rem; border-radius: .75rem; border: none;
      width: 100%; display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-signin:hover { opacity: .92; }
    .login-footer { text-align: center; margin-top: 1.25rem; font-size: .8125rem; color: #94a3b8; }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon"><i class="fa-solid fa-lock"></i></div>
      <h1 class="brand-title">Set a new password</h1>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show mb-3 py-2" style="border-radius:.75rem;font-size:.875rem" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="password">New password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
               placeholder="Re-enter your new password" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" class="btn-signin">
        <i class="fa-solid fa-check"></i> Update Password
      </button>
    </form>

    <div class="login-footer">
      <a href="{{ url_for('login') }}" style="color:#2e6db4;text-decoration:none;">Back to sign in</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
