{% extends "base.html" %}
{% block title %}Two-Factor Authentication{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:380px">
  <div class="text-center mb-4">
    <div style="font-size:3rem">🔐</div>
    <h4 class="mt-2">Verification Required</h4>
    <p class="text-muted small">Enter the 6-digit code from your authenticator app</p>
  </div>

  <form method="POST" action="{{ url_for('security_2fa.challenge_verify') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3">
      <input name="code" class="form-control form-control-lg text-center" maxlength="8"
             required autofocus placeholder="000 000"
             style="font-size:1.8rem;letter-spacing:0.4rem">
      <div class="form-text text-center">Or enter a backup code</div>
    </div>
    <button type="submit" class="btn btn-primary w-100 btn-lg">Verify</button>
  </form>

  <div class="text-center mt-3">
    <a href="{{ url_for('logout') }}" class="text-muted small">Sign in as a different user</a>
  </div>
</div>
{% endblock %}
