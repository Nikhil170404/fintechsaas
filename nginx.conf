# FinTech Desk — Nginx reverse proxy with HTTPS (Let's Encrypt)
# Usage:
#   1. Install: sudo apt install nginx certbot python3-certbot-nginx
#   2. Replace YOUR_DOMAIN with your actual domain
#   3. Copy to /etc/nginx/sites-available/fintechdesk
#   4. ln -s /etc/nginx/sites-available/fintechdesk /etc/nginx/sites-enabled/
#   5. sudo certbot --nginx -d YOUR_DOMAIN
#   6. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;
    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # --- SSL (certbot fills these in) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:;" always;

    # --- File upload limit (16 MB matches Flask config) ---
    client_max_body_size 16m;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # --- Static files served directly by nginx ---
    location /static/ {
        alias /opt/fintechdesk/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- PDF/document downloads — serve from data dir ---
    location /files/ {
        internal;   # only reachable via X-Accel-Redirect from Flask
        alias /opt/fintechdesk/data/;
    }

    # --- Health check (no auth required, used by load balancer) ---
    location = /api/v1/health {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # --- Main app ---
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering    off;
    }
}
